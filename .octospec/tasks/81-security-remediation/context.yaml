baseline: 445d2bb
rules_read:
  - .octospec/index.md
  - .octospec/rules/_index.yaml
  - .octospec/rules/architecture.md
  - .octospec/rules/engineering.md
  - .octospec/rules/collaboration.md
  - .octospec/rules/channel-integration.md
  - .octospec/rules/runtime-lifecycle.md
  - .octospec/rules/extras.md
  - .octospec/rules/openclaw.md
  - .octospec/_global/security.md
additional_scope:
  - Windows CI 显式执行新增安全回归和日志、dotenv 用例，覆盖不支持 O_NOFOLLOW 的描述符校验。
user_override:
  - GitHub issue/PR 与提交说明使用英文。
  - 未授权时不创建提交。
authorization:
  commit_push_pr: true
  merge: true
  alert_disposition: true
  source: 用户后续明确要求按已说明的逐条处置流程提交 PR 并合并 main。
merge_gate:
  required_approving_review_count: 1
  required_status_checks: [CI Gate]
  strict: true
  enforce_admins: true
  auto_merge_allowed: false
  checked_pr: 115
