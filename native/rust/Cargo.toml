[package]
name = "octo-runtime-client"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
description = "Native attached Kernel IPC client for Octo Runtime"
license = "Apache-2.0"
repository = "https://github.com/Mininglamp-OSS/octo-runtime"
readme = "README.md"

[dependencies]
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-util = { version = "=0.7.16", features = ["rt"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["arbitrary_precision", "raw_value"] }
async-stream = "=0.3.6"
futures-util = "=0.3.31"
bigdecimal = "=0.4.9"
regex = "=1.12.2"
url = "=2.5.7"
# url/idna 的宽版本范围会拉入要求 Rust 1.88 的 ICU；固定兼容 1.85 的后端。
idna_adapter = "=1.1.0"

[dev-dependencies]
tokio = { version = "=1.48.0", features = ["signal"] }
